name: Build radio rover firmware

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Firmware (${{ matrix.build_type }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_type: [Debug, Release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ARM GCC Toolchain and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            ninja-build \
            cmake

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=arm-none-eabi-gcc.cmake \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build Firmware
        run: |
          cmake --build build --config ${{ matrix.build_type }}

      - name: Display Artifact Sizes
        run: |
          arm-none-eabi-size build/radio-rover-controller.elf
          ls -lh build/radio-rover-controller*

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: radio-rover-controller-${{ matrix.build_type }}
          path: |
            build/radio-rover-controller.elf
            build/radio-rover-controller.hex
            build/radio-rover-controller.bin
            build/radio-rover-controller.map
          if-no-files-found: error
